<?xml version="1.0" encoding="UTF-8"?><svg id="Layer_3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4673.12 2556"><defs><style>.cls-1{font-family:SeoulAlrimTTF-Bold, 'SeoulAlrim TTF';font-size:60px;font-weight:700;}.cls-2{font-family:SeoulAlrimTTF-Medium, 'SeoulAlrim TTF';font-size:48px;font-weight:500;}.cls-3{fill:#fff;}</style></defs><text class="cls-3" transform="translate(2280.1611 963.9874)"><tspan class="cls-1"><tspan x="0" y="0">젠가</tspan></tspan><tspan class="cls-2"><tspan x="-11.28" y="115.2">강혜원</tspan></tspan><tspan class="cls-2"><tspan x="-114" y="230.4">블록 하나를 빼고</tspan></tspan><tspan class="cls-2"><tspan x="-216.72" y="288">맨 위에 블록 하나를 올리고</tspan></tspan><tspan class="cls-2"><tspan x="-142.8" y="345.6">블록 하나를 또 빼고</tspan></tspan><tspan class="cls-2"><tspan x="-245.52" y="403.2">맨 위에 블록 하나를 또 올리고 </tspan></tspan><tspan class="cls-2"><tspan x="-142.8" y="460.8">구멍이 숭숭 날 수록</tspan></tspan><tspan class="cls-2"><tspan x="-187.32" y="518.4">젠가의 높이는 높아진다.</tspan></tspan><tspan class="cls-2"><tspan x="-233.04" y="576">분명 젠가는 성장하고 있는데</tspan></tspan><tspan class="cls-2"><tspan x="-164.76" y="633.6">점점 더 위태로워진다.</tspan></tspan><tspan class="cls-2"><tspan x="-245.52" y="691.2">높이가 처음의 두 배가 될 무렵</tspan></tspan><tspan class="cls-2"><tspan x="-216.72" y="748.8">젠가는 이제 툭 치면 와르르</tspan></tspan><tspan class="cls-2"><tspan x="-278.16" y="806.4">불완전한 성장은 언제나 나약하다</tspan></tspan></text></svg>