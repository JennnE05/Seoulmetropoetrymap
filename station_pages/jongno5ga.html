    <div class="poem">
      <p class="poem-title">나의 숲 속 과속방지턱 </p>
      <p class="poem-author">김금순</p>
      <p class="poem-body">
        숲 속 등산로
        울퉁불퉁 튀어나온 나무 뿌리는

        소나무 뒤에 숨어 있는 
        청설모하고도 눈 맞추고

        도토리를 입에 물고 있는 
        다람쥐하고도 인사하며

        천천히 쉬엄쉬엄
        산과 얘기하며 가라고

        나무들이 만들어 놓은 
        과속 방지턱



      </p>
