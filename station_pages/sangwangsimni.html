         <div class="poem">
         <p class="poem-title">봄을 위한 祈禱</p>
            <p class="poem-author">김영미</p>
        <p class="poem-body">
        봄!
        냉이 씀바귀 캐러 가는 사람에겐 
        냉이 씀 바귀가 봄
        매화 진달래 보러 가는 사람에겐
        매화 진달래가 봄

        집세 못 내는 이에겐
        집세 낼 수 있는 날이 봄
        아픔 근심 걱정 속에 있던 사람에겐
        아픔 근심 걱정 사라지고 웃는 날이 봄

        봄을 기다리는 모든 이에게
        봄이 갛기를
        두 손 모둡니다


      </p>
