    <div class="poem">
      <p class="poem-title">아버지의 전화</p>
      <p class="poem-author">김수원</p>
      <p class="poem-body">
        아픈 데는 없니
        그게 사랑한다는 말이다
        별일 없니
        걱정된다는 말이다

        바쁘니
        보고 싶다는 말이다
        나는 괜찮아
        외롭다는 말이다

        문득 전화가 뚝 끊어지는 것은
        울고 있다는 말이다
        많이 아프다는 말이다



      </p>
